<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15568d" />
    <meta
      name="description"
      content="Schede di ispezione e manutenzione del Sacro Monte di Varese. Compilazione e salvataggio anche offline."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Schede di Restauro — Sacro Monte di Varese</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./pwa-install.js?v=3.3" defer></script>
    <script src="./app.bundle.js?v=3.3" defer></script>
  </head>
  <body>
    <section id="home" class="home">
      <button id="installHeader" class="install" type="button">
        Installa app
      </button>
      <main class="welcome">
        <div class="home-branding">
          <h1><span id="homeTitle">Schede di Restauro</span></h1>
          <p class="subtitle">
            <span id="homeSubtitle">Sacro Monte di Varese</span>
          </p>
        </div>
        <div class="home-actions">
          <button id="newButton" class="home-button primary">
            Compila una nuova scheda
          </button>
          <button id="resumeButton" class="home-button secondary" disabled>
            Riprendi la bozza
          </button>
          <button id="importButton" class="home-button">Importa JSON</button>
        </div>
        <p id="homeStatus" class="quiet" role="status" hidden="hidden">
          Caricamento…
        </p>
      </main>
      <div class="landscape" aria-hidden="true"></div>
    </section>

    <section id="editor" hidden>
      <header class="toolbar">
        <label for="filename">Nome del file</label>
        <input
          id="filename"
          type="text"
          autocomplete="off"
          aria-label="Nome del file senza estensione"
        />
        <details id="options" class="options">
          <summary aria-label="Opzioni">⋮ <span>Opzioni</span></summary>
          <div class="menu">
            <button id="goHome">Torna alla home</button>
            <button id="resetButton" class="danger">Reset scheda</button>
            <button id="installMenu">Installa app</button>
          </div>
        </details>
      </header>
      <main id="sectionContent" class="sheet" tabindex="-1"></main>
      <section
        id="exportReady"
        class="export-ready"
        aria-labelledby="exportTitle"
        hidden
      >
        <h2 id="exportTitle">PDF e JSON pronti</h2>
        <p id="exportHelp"></p>
        <div class="export-files">
          <a
            id="savePackage"
            class="file-button primary"
            target="_blank"
            rel="noopener"
            hidden
            >Salva PDF e JSON insieme</a
          >
          <a id="savePdf" class="file-button" target="_blank" rel="noopener"
            >Salva PDF</a
          >
          <a id="saveJson" class="file-button" target="_blank" rel="noopener"
            >Salva JSON</a
          >
          <button id="sharePdf" type="button" hidden>Condividi PDF</button>
        </div>
      </section>
      <footer class="navigation">
        <button id="previous" type="button"></button>
        <div class="nav-status">
          <span id="sectionCounter"></span
          ><small id="saveStatus" role="status"></small>
        </div>
        <button id="next" type="button" class="primary"></button>
      </footer>
    </section>

    <dialog id="newDialog">
      <form id="newForm">
        <h2>Nuova scheda</h2>
        <label
          ><select
            id="assetSelect"
            required
            aria-label="Seleziona il bene"
          ></select
        ></label>
        <div class="dialog-actions">
          <button type="button" data-close="newDialog">Annulla</button
          ><button class="primary" type="submit">Apri scheda</button>
        </div>
      </form>
    </dialog>
    <dialog id="messageDialog">
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button data-close="messageDialog" class="primary">Chiudi</button>
      </div>
    </dialog>
    <input id="jsonInput" type="file" accept=".json,application/json" hidden />
    <input id="photoInput" type="file" accept="image/*" multiple hidden />
    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
    <div id="toast" role="status" hidden></div>
    <noscript>Attiva JavaScript per compilare le schede.</noscript>
  </body>
</html>
